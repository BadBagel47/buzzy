name: Firebase - inspect and back up
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buzzy-firebase-cloud
  cancel-in-progress: false

jobs:
  inventory:
    if: github.repository == 'BadBagel47/buzzy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: firebase-inventory
    permissions:
      contents: read
      id-token: write
    env:
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      GOOGLE_SERVICE_ACCOUNT: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Select Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Validate repository and identity selectors
        run: node ops/check-context.mjs inventory
      - name: Get temporary Google access
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: buzzy-197dc
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/firebase.database,https://www.googleapis.com/auth/userinfo.email
          create_credentials_file: false
          export_environment_variables: false
      - name: Read settings and back up rules
        run: node ops/inventory.mjs inventory
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
      - name: Save sanitized inventory and rules backup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: buzzy-inventory-${{ github.run_id }}
          path: ci-reports/inventory/
          retention-days: 3
          if-no-files-found: warn
